{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign in | NetOracle</title>
    {% include "partials/app_head.html" %}
</head>
<body class="theme-{{ current_theme }}">
    <main class="no-auth">
        <div class="no-auth-card">
            <div class="no-auth-brand">
                <img class="no-on-dark" src="{% static 'img/branding/netoracle-mark-dark.svg' %}" alt="" width="56" height="56">
                <img class="no-on-light" src="{% static 'img/branding/netoracle-mark-light.svg' %}" alt="" width="56" height="56">
                <h1>NetOracle</h1>
                <p>Network intelligence and attack forecasting</p>
            </div>

            <form method="post" class="no-form no-stack">
                {% csrf_token %}

                {% if form.errors %}
                <div class="no-message no-message-error" role="alert">Invalid username or password.</div>
                {% endif %}

                <div class="no-field">
                    <label class="no-label" for="id_username">Username</label>
                    <input type="text" name="username" autofocus="" autocapitalize="none" autocomplete="username" maxlength="150" required="" id="id_username">
                </div>

                <div class="no-field">
                    <label class="no-label" for="id_password">Password</label>
                    <input type="password" name="password" autocomplete="current-password" required="" id="id_password">
                </div>

                <button type="submit" class="no-btn no-btn-primary">Sign in</button>
            </form>
            <p class="no-auth-foot">Offline forecasting prototype &middot; authorised users only</p>
        </div>
    </main>
</body>
</html>
